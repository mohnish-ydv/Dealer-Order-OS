name: Build signed Apex DMS Android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPECTED_SHA1: D4:1D:9F:BA:97:B0:74:C1:D4:74:B4:0B:4E:CD:EB:A0:4C:C2:76:1B
      APEX_KEYSTORE_PASSWORD: ${{ secrets.APEX_KEYSTORE_PASSWORD }}
      APEX_KEY_ALIAS: ${{ secrets.APEX_KEY_ALIAS }}
      APEX_KEY_PASSWORD: ${{ secrets.APEX_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          APEX_KEYSTORE_BASE64: ${{ secrets.APEX_KEYSTORE_BASE64 }}
        run: |
          test -n "$APEX_KEYSTORE_BASE64" || { echo "Missing APEX_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$APEX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/apex-dms-release.jks"
          echo "APEX_KEYSTORE_PATH=$RUNNER_TEMP/apex-dms-release.jks" >> "$GITHUB_ENV"

      - name: Verify release keystore fingerprint
        if: github.event_name != 'pull_request'
        run: |
          test -n "$APEX_KEYSTORE_PASSWORD" || { echo "Missing APEX_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$APEX_KEY_ALIAS" || { echo "Missing APEX_KEY_ALIAS"; exit 1; }
          test -n "$APEX_KEY_PASSWORD" || { echo "Missing APEX_KEY_PASSWORD"; exit 1; }
          ACTUAL_SHA1=$(keytool -list -v -keystore "$APEX_KEYSTORE_PATH" -storepass "$APEX_KEYSTORE_PASSWORD" -alias "$APEX_KEY_ALIAS" | awk -F'SHA1: ' '/SHA1:/{print $2; exit}' | tr -d '\r')
          echo "Release keystore SHA1: $ACTUAL_SHA1"
          test "${ACTUAL_SHA1^^}" = "${EXPECTED_SHA1^^}" || { echo "Wrong signing keystore. Expected $EXPECTED_SHA1"; exit 1; }

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Build debug APK for compile validation
        run: gradle :app:assembleDebug --stacktrace

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: gradle :app:assembleRelease --stacktrace

      - name: Verify APK signature identity
        if: github.event_name != 'pull_request'
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_SHA1=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/certificate SHA-1 digest/{print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          EXPECTED=$(echo "$EXPECTED_SHA1" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$APK_SHA1" = "$EXPECTED" || { echo "Signed APK fingerprint mismatch"; exit 1; }

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-DMS-Debug-Compile-Check
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Apex-DMS-BAOS-M2-Signed-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
